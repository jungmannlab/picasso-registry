[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "picasso-registry"
dynamic = ["version"]
description = "Provenance & metrics database (service + client) for the DNA-PAINT automation stack"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MIB Lab" }]
# Base is intentionally EMPTY: `import picasso_registry` needs nothing but the
# package itself (__init__ only reads the setuptools-scm version). Every runtime
# surface pulls exactly what it uses via an extra below. This keeps the shared
# `[auth]` helper FastAPI-only, so an importer like monet (WP-12a) that only wants
# `picasso_registry.auth` never drags the DB/migration stack (sqlalchemy, alembic,
# python-ulid). Install `[server]` to run the service.
dependencies = []

[project.optional-dependencies]
# The shared service-auth helper (picasso_registry.auth) that monet reuses
# (WP-12a): `require_scope`, the token->(scope,label) map, and the fail-closed
# host guard. FastAPI only — deliberately free of the DB/migration stack, so it
# is a lightweight, intention-revealing install target for the other service.
auth = ["fastapi>=0.110"]
# The frozen cross-repo data contracts (picasso_registry.contracts /
# picasso_registry.schemas) that PycroFlow / picasso-workflow / picasso-agent
# import. Pydantic only.
contracts = ["pydantic>=2.6"]
# The thin + buffered REST clients (picasso_registry.client /
# picasso_registry.buffered_client). requests is lazy-imported by the thin
# client; the buffered client (SQLite outbox) needs python-ulid.
client = ["requests>=2.31", "python-ulid>=2.2"]
# The full FastAPI service: app, models, db, crud, Alembic migrations, and the
# `picasso-registry` CLI. This is what a deployment installs.
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "alembic>=1.13",
    "python-ulid>=2.2",
    # the `picasso-registry token` store + --env-file loading (tokens.py is
    # lazy about it, so [auth] and the base package stay dotenv-free)
    "python-dotenv>=1.0",
]
# `test` gives dependent repos the in-memory mock (picasso_registry.testing),
# which drives the real app through Starlette's TestClient — so it needs the full
# server stack plus the clients and httpx.
test = ["picasso-registry[server,client]", "httpx>=0.27"]
dev = [
    "picasso-registry[server,client,contracts]",
    "pytest>=8",
    "httpx>=0.27",
    "black==25.9.0",
    "flake8>=7",
    "Flake8-pyproject>=1.2",
    "pre-commit>=3.7",
]

[project.scripts]
picasso-registry = "picasso_registry.cli:main"
picasso-registry-export-openapi = "picasso_registry.export_openapi:main"
picasso-registry-backfill-liveloc = "picasso_registry.backfill_liveloc:main"

[tool.setuptools_scm]
write_to = "src/picasso_registry/_version.py"
fallback_version = "0.0.1.dev0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# the WP-DASH dashboard shell, served by GET /dashboard
picasso_registry = ["dashboard.html"]

[tool.black]
target-version = ["py310"]
line-length = 79
extend-exclude = '_version.py'

[tool.flake8]
max-line-length = 79
extend-ignore = ["E203", "E501", "W503"]
exclude = [".git", "__pycache__", "build", "dist", "src/picasso_registry/_version.py"]
