name: Lint

# Style gate on a cheap GitHub-hosted runner. black and flake8 read their config
# from pyproject.toml ([tool.black] / [tool.flake8] via Flake8-pyproject); the
# versions come from the repo's own [dev] extra (installed below) so CI, the
# local pre-commit hook, and developers all agree. This is a REQUIRED merge gate
# for main — it must stay hosted (no lab hardware / secrets) so it never blocks
# on an unavailable self-hosted runner and works on forks.

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # setuptools-scm needs tags/history for the version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package + lint tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: black --check
        run: black --check .

      - name: flake8
        run: flake8 .
