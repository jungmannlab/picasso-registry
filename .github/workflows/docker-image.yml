name: Docker image

# Two jobs on a cheap GitHub-hosted runner:
#
#   smoke   — build the image and actually RUN it (migrate on start, bind
#             0.0.0.0 with a minted token, poll /health). This is the safety
#             net the repo lacked: the stale-Python-floor Dockerfile bug would
#             have been caught here instead of in production. Runs on every
#             PR and branch push, and as the pre-flight before a publish.
#
#   publish — on a `v*` release tag only (and only if `smoke` passed), build
#             and push to GHCR (ghcr.io/<owner>/picasso-registry) so labs can
#             `docker pull` a versioned image instead of building on the box.
#
# `fetch-depth: 0` is required in BOTH: the multi-stage Dockerfile's builder
# stage runs setuptools-scm over the .git in the build context, so without the
# tags the image would report the 0.0.1.dev0 fallback.
#
# `pull_request:` is intentionally unfiltered (fires for PRs into ANY base
# branch); the push trigger is scoped to the long-lived branches plus v* tags.

on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - "v*"
  pull_request:

jobs:
  smoke:
    name: Build & smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # setuptools-scm needs tags/history for the version

      - name: Build image
        run: docker build -t picasso-registry:ci .

      - name: Mint a write token (throwaway container -> mounted env file)
        run: |
          mkdir -p "$PWD/ci-etc"
          docker run --rm -v "$PWD/ci-etc:/etc/picasso-registry" \
            picasso-registry:ci \
            picasso-registry token add --scope write --label ci \
            --env-file /etc/picasso-registry/registry.env

      - name: Run the container (0.0.0.0 bind + mounted tokens, as in deploy)
        run: |
          mkdir -p "$PWD/ci-data"
          docker run -d --name reg \
            -p 8000:8000 \
            -v "$PWD/ci-data:/data" \
            -v "$PWD/ci-etc:/etc/picasso-registry:ro" \
            -e PAINT_REGISTRY_ENV_FILE=/etc/picasso-registry/registry.env \
            picasso-registry:ci

      - name: Wait for /health
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "service healthy"; exit 0
            fi
            sleep 1
          done
          echo "::error::/health did not answer within 30s"; exit 1

      - name: Assert the container is still up (fail-closed guard satisfied)
        run: |
          state="$(docker inspect -f '{{.State.Status}}' reg)"
          echo "container state: $state"
          [ "$state" = "running" ] || { echo "::error::container not running"; exit 1; }

      - name: Report the image's version (should be tag-derived, not 0.0.1.dev0)
        run: |
          docker run --rm picasso-registry:ci \
            python -c "import picasso_registry; print(picasso_registry.__version__)"

      - name: Dump logs on failure
        if: failure()
        run: docker logs reg || true

  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # setuptools-scm needs tags/history for the version

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/picasso-registry
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
